<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout — Golden Boy</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script>
        !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window, document,'script','https://connect.facebook.net/en_US/fbevents.js');
        fbq('init', '829724033537044'); fbq('track', 'PageView');
    </script>
</head>
<body>
    <header>
        <div class="nav-container">
           <a href="index.html" class="logo">
    <img src="images/logo.png" alt="GOLDEN BOY">
</a>
        </div>
    </header>

    <section class="section">
        <h1 class="section-title">CHECKOUT</h1>
        
        <div class="cart-layout">
            <!-- Left: Cart Items & Form -->
            <div>
                <div id="cart-items-container" class="cart-items">
                    <!-- Injected dynamically -->
                </div>
                
                <form id="checkout-form" class="checkout-form" style="margin-top: 3rem;">
                    <h3 style="margin-bottom: 1.5rem; font-weight:900;">CUSTOMER DETAILS</h3>
                    <div class="form-group">
                        <label>FULL NAME *</label>
                        <input type="text" id="c-name" required>
                    </div>
                    <div class="form-group">
                        <label>PHONE NUMBER *</label>
                        <input type="tel" id="c-phone" required>
                    </div>
                    <div class="form-group">
                        <label>WILAYA *</label>
                        <input type="text" id="c-wilaya" required>
                    </div>
                    <div class="form-group">
                        <label>COMMUNE / ADDRESS *</label>
                        <input type="text" id="c-address" required>
                    </div>
                    <div class="form-group">
                        <label>NOTES (Optional)</label>
                        <textarea id="c-notes" rows="3"></textarea>
                    </div>
                    <button type="submit" id="submit-order-btn" class="btn">CONFIRM ORDER</button>
                </form>
            </div>

            <!-- Right: Order Summary -->
            <div class="order-summary">
                <h3 style="margin-bottom: 1.5rem; font-weight:900;">SUMMARY</h3>
                <div class="summary-line">
                    <span>SUBTOTAL</span>
                    <span id="summary-subtotal">0 DA</span>
                </div>
                <div class="summary-line" style="color: green;">
                    <span>DISCOUNT</span>
                    <span id="summary-discount">0 DA</span>
                </div>
                <div class="summary-line total">
                    <span>TOTAL</span>
                    <span id="summary-total">0 DA</span>
                </div>
            </div>
        </div>

        <!-- Success View (Hidden by default) -->
        <div class="success-block" id="success-block">
            <h2>ORDER CONFIRMED</h2>
            <p style="margin-bottom: 2rem;">Thank you for shopping with Golden Boy.<br>We have received your order details.</p>
            <button id="wa-btn" class="btn" style="background:#25D366; border-color:#25D366; color:#fff; max-width: 300px; margin-bottom: 1rem;">ORDER VIA WHATSAPP</button>
            <br>
            <a href="index.html" class="btn btn-outline" style="max-width: 300px;">CONTINUE SHOPPING</a>
        </div>
    </section>

    <script src="js/products.js"></script>
    <script src="js/script.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/email.js"></script>
</body>
</html>
